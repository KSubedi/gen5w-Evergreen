name: Release

# Publishes a GitHub Release when a version tag is pushed:
#   git tag -a v1.2.0 -m "v1.2.0" && git push origin v1.2.0
# A beta tag, v<package-version>-beta.N (e.g. v1.2.0-beta.1), may be on any branch and
# is published as a pre-release, which GitHub never shows as the latest release (the
# site and README link to releases/latest). Plain v<package-version> tags must be on main.
# CI runs in full first; nothing is published unless every check passes. The
# release carries the installable package, the four Leafia kit sizes and SHA256SUMS, all
# built from exactly the tagged commit.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release; the only job that can write

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tags and history, so the package's BUILD stamp names the version

      - name: Release kind
        id: kind
        run: |
          case "$GITHUB_REF_NAME" in
            v*-beta.*)
              n=${GITHUB_REF_NAME##*-beta.}
              case "$n" in ''|*[!0-9]*) echo "beta tags end in -beta.<number>: $GITHUB_REF_NAME"; exit 1 ;; esac
              echo "beta=true" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME%-beta.*}" >> "$GITHUB_OUTPUT" ;;
            *-*) echo "unknown tag form $GITHUB_REF_NAME (use v<version> or v<version>-beta.<n>)"; exit 1 ;;
            *)   echo "beta=false" >> "$GITHUB_OUTPUT"
                 echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
          esac
          base=${GITHUB_REF_NAME%-beta.*}
          ar_version=${base#v}
          if [ -f "releases/carplay-ar/$ar_version/ar-build.json" ]; then
            [ "${GITHUB_REF_NAME#*-beta.}" != "$GITHUB_REF_NAME" ] || {
              echo "CarPlay AR snapshots are prereleases only"; exit 1; }
            echo "ar=true" >> "$GITHUB_OUTPUT"
            echo "ar-version=$ar_version" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag must be on main
        if: steps.kind.outputs.beta != 'true'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_REF_NAME is not on main; releases are only made from main"; exit 1; }

      - name: Tag must match the package version
        run: |
          if [ "${{ steps.kind.outputs.ar }}" = true ]; then
            v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' tools/build-carplay-ar-installer.py)
          else
            v=$(sed -n 's/^package-version=//p' packages/wireless-carplay-aa/NEMESIS.data | tr -d '"')
          fi
          [ "${{ steps.kind.outputs.version }}" = "v$v" ] || {
            echo "tag $GITHUB_REF_NAME does not match package-version $v in packages/wireless-carplay-aa/NEMESIS.data"; exit 1; }

      - name: Build the package and the kit
        if: steps.kind.outputs.ar != 'true'
        run: |
          mkdir -p release
          ./tools/build-package.sh "release/Evergreen_Wireless_CarPlay_AA-$GITHUB_REF_NAME.zip"
          for lv in quick standard port full; do
            n=leafia-kit-$lv; [ $lv = standard ] && n=leafia-kit
            ./tools/build-kit.sh $lv "release/$n-$GITHUB_REF_NAME.zip"
          done
          unzip -p "release/Evergreen_Wireless_CarPlay_AA-$GITHUB_REF_NAME.zip" packages/wireless.carplay.aa.zip \
            | python3 -c "import io,sys,zipfile; print('package BUILD:', zipfile.ZipFile(io.BytesIO(sys.stdin.buffer.read())).read('BUILD').decode().strip())"
          (cd release && sha256sum -- *.zip > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Set up Java for AR validation
        if: steps.kind.outputs.ar == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate and package the tested AR delta snapshot
        if: steps.kind.outputs.ar == 'true'
        env:
          AR_VERSION: ${{ steps.kind.outputs.ar-version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libsmali-java
          pip install --require-hashes -r tools/requirements.txt
          cc -DHOST -O2 -Wall -o tools/lpatch/lpatch-host tools/lpatch/lpatch.c
          curl -fL --retry 3 https://storage.googleapis.com/r8-releases/raw/8.3.37/r8.jar -o "$RUNNER_TEMP/r8.jar"
          echo "900dfbc649519969fc5a4c7520d6b7355338e565fa1249874e0190b8d61b1199  $RUNNER_TEMP/r8.jar" | sha256sum -c -
          D8_JAR="$RUNNER_TEMP/r8.jar" sh src/carplay-ar/build.sh
          sh tools/test-carplay-ar.sh
          python3 tools/prepare-carplay-ar-release.py --version "$AR_VERSION" --out dist/ar-release-input
          mkdir -p release
          python3 tools/build-carplay-ar-installer.py --patches dist/ar-release-input/patches --enable-ar \
            --out "release/UltimateWirelessProjection_EV6_US_260507_$AR_VERSION.zip"
          python3 tools/build-carplay-ar-controls.py release
          (cd release && sha256sum -- *.zip > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          BETA: ${{ steps.kind.outputs.beta }}
          AR_VERSION: ${{ steps.kind.outputs.ar-version }}
        run: |
          title="Evergreen $GITHUB_REF_NAME"
          if [ -n "$AR_VERSION" ]; then
            cp "releases/carplay-ar/$AR_VERSION/NOTES.md" notes.md
            title="Ultimate Wireless Projection EV6 AR $AR_VERSION"
          else
          cat > notes.md <<EOF
          ## Install

          1. Install [NEMESIS](https://github.com/xwtk/hmg_nemesis) 1.15 or newer on the head unit (1.16 or newer recommended). Updating Evergreen on NEMESIS 1.16 or newer? Install over the old version, no need to uninstall first. Coming from the original Leafia (v1.0.5 or older)? Uninstall it in NEMESIS Manager and restart first.
          2. Unzip **Evergreen_Wireless_CarPlay_AA-$GITHUB_REF_NAME.zip** onto the root of an empty exFAT or FAT32 USB drive.
          3. Car on, plug in the drive and confirm the install. It takes a few minutes. When the head unit restarts, remove the drive: leaving it in can stop CarPlay or Android Auto connecting the first time.

          See **Known quirks** in the README if something doesn't connect at first.

          Check your car first on the [compatibility page](https://zpoon.github.io/gen5w-Evergreen/). Something wrong? Run **leafia-kit-$GITHUB_REF_NAME.zip** and open an issue with the problem form. (Other kit sizes: **quick** to check a car, **port** to add a new car, **full** for every crash record.) Uninstall any time from NEMESIS Manager; every file goes back to stock.

          Verify downloads with \`sha256sum -c SHA256SUMS\`.
          EOF
          fi
          # A release made in the web page (which also makes the tag) already exists:
          # attach the files to it and add the install notes under its own text, once.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            # a beta stays a pre-release (and never "latest") even if the box was missed
            [ "$BETA" = true ] && gh release edit "$GITHUB_REF_NAME" --prerelease --latest=false
            gh release view "$GITHUB_REF_NAME" --json body --jq .body > body.md
            if ! grep -q 'sha256sum -c SHA256SUMS' body.md; then
              { cat body.md; echo; cat notes.md; } > full.md
              gh release edit "$GITHUB_REF_NAME" --notes-file full.md
            fi
          else
            pre=; [ "$BETA" = true ] && pre="--prerelease --latest=false"
            gh release create "$GITHUB_REF_NAME" release/* $pre \
              --verify-tag --title "$title" \
              --notes-file notes.md --generate-notes
          fi
