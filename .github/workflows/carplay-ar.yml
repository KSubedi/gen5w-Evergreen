name: CarPlay AR prototype

on:
  push:
    paths:
      - 'src/carplay-ar/**'
      - 'kits/ar-stock/**'
      - 'kits/ar-control/**'
      - 'kits/ar-installer/**'
      - 'kits/ar-finish/**'
      - 'tools/*ar-finish*'
      - 'tools/*carplay-ar*'
      - 'tools/*ar-log*'
      - 'tools/build-package.sh'
      - '.github/workflows/carplay-ar.yml'
  pull_request:
    paths:
      - 'src/carplay-ar/**'
      - 'kits/ar-stock/**'
      - 'kits/ar-control/**'
      - 'kits/ar-installer/**'
      - 'kits/ar-finish/**'
      - 'tools/*ar-finish*'
      - 'tools/*carplay-ar*'
      - 'tools/*ar-log*'
      - 'tools/build-package.sh'
      - '.github/workflows/carplay-ar.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsmali-java
          pip install --require-hashes -r tools/requirements.txt
          cc -DHOST -O2 -Wall -o tools/lpatch/lpatch-host tools/lpatch/lpatch.c
      - name: Fetch pinned D8 compiler
        run: |
          curl -fL --retry 3 https://storage.googleapis.com/r8-releases/raw/8.3.37/r8.jar -o "$RUNNER_TEMP/r8.jar"
          echo "900dfbc649519969fc5a4c7520d6b7355338e565fa1249874e0190b8d61b1199  $RUNNER_TEMP/r8.jar" | sha256sum -c -
      - name: Build helpers and test conversion, injection and delta generation
        env:
          D8_JAR: ${{ runner.temp }}/r8.jar
        run: |
          sh src/carplay-ar/build.sh
          sh tools/test-carplay-ar.sh
          sh tools/build-package.sh
          python3 tools/compat-built.py --check
          git diff --exit-code -- patches tools/lpatch/lpatch docs/data/compat.json
